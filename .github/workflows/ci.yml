name: CI

# Runs on every push and pull request. deploy.yml also runs it (as a reusable workflow) before it
# releases anything.
on:
  push:
  pull_request:
  workflow_call:

# Least privilege: CI only reads the repository. Actions are pinned to commit SHAs (Dependabot
# keeps them current), so a moved tag can't change what runs next to the release secrets.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          package_json_file: package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Known vulnerabilities in any dependency, dev tooling included: the build toolchain produces
      # the attested release, so it counts as much as the code that ships.
      - name: Dependency audit
        run: pnpm audit --audit-level=high

      # Same sources → same bytes, for the API bundle and the client engine. Anyone rebuilding a
      # release from its commit must get the attested checksums (VERIFICATION.md).
      - name: The build is reproducible
        run: |
          for n in 1 2; do
            pnpm --filter @poof/worker run bundle "$RUNNER_TEMP/worker-$n" > /dev/null
            pnpm -s build:engine > /dev/null
            cp dist-engine/poof-engine.js "$RUNNER_TEMP/engine-$n.js"
          done
          cmp "$RUNNER_TEMP/worker-1/index.js" "$RUNNER_TEMP/worker-2/index.js"
          cmp "$RUNNER_TEMP/engine-1.js" "$RUNNER_TEMP/engine-2.js"

      - run: pnpm typecheck:all
      - run: pnpm lint:all
      - run: pnpm test:all

      # Boots the API locally and runs the client engine against it.
      - run: pnpm test:e2e

      # Real Chrome contexts over real WebRTC, through the smoke-test page (Vite) and the local API.
      # Uses the Google Chrome preinstalled on ubuntu-latest (Playwright channel "chrome").
      - run: pnpm test:browser
