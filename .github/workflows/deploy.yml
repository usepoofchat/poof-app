name: Deploy

# Deploys the API only (api.usepoof.chat). The web app at https://usepoof.chat is hosted
# separately and is never touched from here.
#
# Started by hand only (Actions → Deploy → Run workflow, from main): a push to main runs the checks
# (ci.yml) and nothing else. Every release is built here: bundle → checksum → GitHub attestation →
# deploy those exact bytes → check that the live API reports this commit. See VERIFICATION.md.
#
# The GitHub environment "production" needs:
#   secrets  DEPLOY_TOKEN, DEPLOY_ACCOUNT_ID
#   vars     API_URL (https://api.usepoof.chat), checked after the deploy
# and should allow deployments from main only (Settings → Environments).
# TURN secrets are set on the deployed API, not here.

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # Sigstore signing for the attestation
      attestations: write
    env:
      GIT_REF: ${{ github.ref }}
    steps:
      - name: Deploys only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploys only from main (this is $GIT_REF)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          package_json_file: package.json

      # No dependency cache in the job that holds the deploy secrets and signs the release.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Bundle the API
        run: pnpm --filter @poof/worker run bundle ../release/worker-bundle

      # The client engine the web app ships (README: "The engine for the web app").
      - name: Build the client engine
        run: |
          pnpm build:engine
          cp dist-engine/poof-engine.js release/

      - name: Checksums
        run: |
          (cd release/worker-bundle && sha256sum index.js) > release/worker-checksums.sha256
          (cd release && sha256sum poof-engine.js) > release/engine-checksums.sha256
          cat release/worker-checksums.sha256 release/engine-checksums.sha256

      # Signs (Sigstore, via GitHub) the checksum lists, the bundle and the engine, tied to this
      # commit and run.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/worker-checksums.sha256
            release/worker-bundle/index.js
            release/engine-checksums.sha256
            release/poof-engine.js

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            release/worker-checksums.sha256
            release/worker-bundle/index.js
            release/engine-checksums.sha256
            release/poof-engine.js
          retention-days: 90
          if-no-files-found: error

      # Uploads the attested bundle byte for byte, without rebundling. The bundle path goes before
      # --var, which takes every argument after it.
      - name: Deploy exactly this bundle
        working-directory: worker
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_ACCOUNT_ID: ${{ secrets.DEPLOY_ACCOUNT_ID }}
          COMMIT: ${{ github.sha }}
        run: >-
          pnpm run release ../release/worker-bundle/index.js
          --var "COMMIT_SHA:$COMMIT"

      - name: The live API runs this commit
        env:
          API_URL: ${{ vars.API_URL }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Set the API_URL variable on the 'production' environment."
            exit 1
          fi
          # A new version takes a few seconds to roll out everywhere.
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$API_URL/api/health" | grep -q "\"commit\":\"$COMMIT\""; then exit 0; fi
            sleep 10
          done
          echo "::error::$API_URL/api/health does not report $COMMIT."
          exit 1
